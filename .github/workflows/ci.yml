name: ASB
on: [push, pull_request]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - run: uv sync --locked --python 3.12
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - name: CLI and gateway maintenance tests
        run: uv run --locked pytest -q -m "not real_model"
      - name: Real-model smoke test
        run: uv run --locked pytest -q -m real_model --cov-append
